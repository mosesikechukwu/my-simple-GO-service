global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "go-service"
    static_configs:
      - targets: ["my-simple-service:8080"]

  - job_name: "typescript-service"
    static_configs:
      - targets: ["typescript-service:3000"]
